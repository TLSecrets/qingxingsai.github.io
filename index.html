<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心理健康 离线答题训练系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 15px 10px;
            line-height: 1.6;
            font-size: 15px;
            padding-bottom: 30px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 10px;
            padding: 20px 15px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 20px;
        }
        /* 模式栏：增加设置按钮 */
        .mode-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            justify-content: center;
        }
        .mode-btn, .set-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: #3498db;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            flex: 1;
            min-width: 90px;
            max-width: 130px;
        }
        .mode-btn.active {
            background: #2980b9;
        }
        .set-btn {
            background: #27ae60;
        }
        /* 电脑端右侧悬浮面板 */
        .float-panel {
            display: none;
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(0,0,0,0.15);
            z-index: 999;
            min-width: 180px;
        }
        @media (min-width: 768px) {
            .float-panel {
                display: block;
            }
        }
        /* 移动端底部弹窗遮罩 */
        .popup-mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
        }
        /* 移动端底部弹窗 */
        .popup-set {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
            border-radius: 16px 16px 0 0;
            padding: 20px 15px;
            z-index: 1001;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .popup-set.show {
            transform: translateY(0);
        }
        .popup-mask.show {
            display: block;
        }
        .popup-head {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        .switch-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 12px 0;
            font-size: 14px;
        }
        .float-btn {
            width: 100%;
            padding: 10px 0;
            margin: 6px 0;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        .float-btn:nth-child(1) {background: #95a5a6;}
        .float-btn:nth-child(2) {background: #e67e22;}
        .float-btn:nth-child(3) {background: #e74c3c;}
        .close-popup {
            margin-top: 10px;
            background: #eee !important;
            color: #333 !important;
        }
        /* 开关样式 */
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }
        .switch input {opacity: 0; width: 0; height: 0;}
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 2px; bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {background-color: #27ae60;}
        input:checked + .slider:before {transform: translateX(18px);}
        /* 题目区域 */
        .q-container {
            margin: 15px 0;
        }
        .q-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .q-title {
            font-size: 15px;
            color: #2c3e50;
            margin-bottom: 12px;
        }
        .option-item {
            margin: 8px 0;
            padding: 12px 10px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #ddd;
            transition: all 0.2s;
            font-size: 15px;
            min-height: 44px;
            display: flex;
            align-items: center;
        }
        .option-item:active {background: #f0f7ff;}
        .option-item.correct {background: #2ecc71; color: #fff; border-color: #27ae60;}
        .option-item.wrong {background: #e74c3c; color: #fff; border-color: #c0392b;}
        .answer-hint {
            margin-top: 10px;
            padding: 8px 10px;
            background: #fef5e7;
            border-radius: 6px;
            color: #d35400;
            display: none;
            font-size: 14px;
        }
        /* 分页控制 */
        .page-control {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }
        .page-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 6px;
            background: #3498db;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
        }
        .page-btn:disabled {background: #bdc3c7; cursor: not-allowed;}
        /* 统计信息 */
        .stat-info {
            text-align: center;
            margin: 10px 0;
            font-size: 14px;
            color: #666;
        }
        /* 无题目提示 */
        .empty-tip {
            text-align: center;
            padding: 40px 0;
            color: #999;
            font-size: 15px;
        }
        hr {
            margin:10px 0;border:none;border-top:1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>心理健康 离线答题训练系统</h1>
        <!-- 模式选择 + 设置按钮 -->
        <div class="mode-box">
            <button class="mode-btn" data-mode="all">全部题库</button>
            <button class="mode-btn" data-mode="rand50">随机50题</button>
            <button class="mode-btn" data-mode="error">错题训练</button>
            <button class="set-btn" id="openSetBtn">设置</button>
        </div>
        <!-- 统计信息 -->
        <div class="stat-info">
            进度：<span id="currIdx">0</span> / <span id="totalNum">0</span> &nbsp;&nbsp;
            错题：<span id="errorCount">0</span>
        </div>
        <!-- 题目渲染区域 -->
        <div id="questionBox" class="q-container"></div>
        <!-- 分页按钮 -->
        <div class="page-control">
            <button class="page-btn" id="prevBtn">上一题</button>
            <button class="page-btn" id="nextBtn">下一题</button>
        </div>
    </div>

    <!-- 电脑端右侧悬浮设置面板 -->
    <div class="float-panel">
        <h4>功能设置</h4>
        <div class="switch-item">
            <span>选后显示答案</span>
            <label class="switch">
                <input type="checkbox" id="showAnsSwitch">
                <span class="slider"></span>
            </label>
        </div>
        <div class="switch-item">
            <span>整页显示题目</span>
            <label class="switch">
                <input type="checkbox" id="allPageSwitch">
                <span class="slider"></span>
            </label>
        </div>
        <div class="switch-item">
            <span>答对自动下一题</span>
            <label class="switch">
                <input type="checkbox" id="autoNextSwitch">
                <span class="slider"></span>
            </label>
        </div>
        <hr>
        <button class="float-btn" id="resetCurr">重置当前试卷</button>
        <button class="float-btn" id="resetNew">重新随机试卷</button>
        <button class="float-btn" id="clearError">清空错题库</button>
    </div>

    <!-- 移动端底部弹窗设置 -->
    <div class="popup-mask" id="popupMask"></div>
    <div class="popup-set" id="popupSet">
        <div class="popup-head">功能设置</div>
        <div class="switch-item">
            <span>选后显示答案</span>
            <label class="switch">
                <input type="checkbox" class="pop-switch" data-id="showAnsSwitch">
                <span class="slider"></span>
            </label>
        </div>
        <div class="switch-item">
            <span>整页显示题目</span>
            <label class="switch">
                <input type="checkbox" class="pop-switch" data-id="allPageSwitch">
                <span class="slider"></span>
            </label>
        </div>
        <div class="switch-item">
            <span>答对自动下一题</span>
            <label class="switch">
                <input type="checkbox" class="pop-switch" data-id="autoNextSwitch">
                <span class="slider"></span>
            </label>
        </div>
        <hr>
        <button class="float-btn pop-btn" data-type="resetCurr">重置当前试卷</button>
        <button class="float-btn pop-btn" data-type="resetNew">重新随机试卷</button>
        <button class="float-btn pop-btn" data-type="clearError">清空错题库</button>
        <button class="float-btn close-popup" id="closeSetBtn">关闭</button>
    </div>

    <script>
        // 完整题库数据
        const questionBank = [
{"q":"以下哪项不符合心理健康的标准？?","opts":["A. 自我陶醉","B. 勇敢","C. 关爱他人","D. 热爱生命"],"ans":"A"},
{"q":"请在下列选项中找出低自我形象。?","opts":["A. 接纳自我","B. 有安全感","C. 不清楚个人的能力","D. 对自己的行为负责"],"ans":"C"},
{"q":"以下哪一项不是人生发展顺利的表现？?","opts":["A. 不顾未来","B. 行动有信心","C. 独立进取","D. 感情甜蜜"],"ans":"A"},
{"q":"请在下列选项中选出成长的阻力。?","opts":["A. 被了解","B. 受支持","C. 称赞","D. 被忽略"],"ans":"D"},
{"q":"大学生自我形象不包括以下哪一类型？?","opts":["A. 延缓型","B. 达成型","C. 确定型","D. 早定型"],"ans":"C"},
{"q":"大学生自我形象不包括以下哪一项？?","opts":["A. 友善","B. 成熟","C. 学业","D. 作息"],"ans":"D"},
{"q":"以下哪一项不属于PERMA模型？?","opts":["A. 人际关系","B. 性格","C. 投入","D. 意义"],"ans":"B"},
{"q":"下面哪一项不在积极心理学的六类美德之中？?","opts":["A. 仁爱","B. 正义","C. 节制","D. 诚实"],"ans":"D"},
{"q":"积极心理学的24种优势不包含以下哪一项？?","opts":["A. 公平","B. 责备","C. 好奇心","D. 希望"],"ans":"B"},
{"q":"以下哪一部分不属于个体自我的总和之一？?","opts":["A. 思想","B. 行动","C. 情感","D. 态度"],"ans":"B"},
{"q":"以下\"情绪\"的描述,哪一项是不恰当的？?","opts":["A. 情绪是指客观事物是否满足人的需要所产生的内心体验","B. 在需要得到满足时,会产生积极的情绪","C. 人要时刻保持积极情绪才是好的","D. 积极情绪有喜悦、爱、轻松、宁静"],"ans":"C"},
{"q":"下列哪一项不属于积极情绪的功能？?","opts":["A. 积极情绪会激活一般的行为趋势","B. 积极情绪会扩展个体的瞬间思维活动序列","C. 积极情绪有利于心理和身体健康","D. 积极情绪让人一直保持在喜悦平和状态"],"ans":"D"},
{"q":"以下\"消极情绪\"的描述,哪一项是不恰当的？?","opts":["A. 消极情绪是在某种具体行为中,由外因或内因影响而产生的不良情绪体验","B. 消极情绪有羞愧、内疚、恐惧、悲伤","C. 在需要得不到满足时,会产生消极的感受","D. 消极情绪是不正常的"],"ans":"D"},
{"q":"下列哪一项不属于情绪的外部表现？?","opts":["A. 面部表情","B. 体态表情","C. 他人表情","D. 语言表情"],"ans":"C"},
{"q":"下列哪一项不属于情绪管理的有效方式？?","opts":["A. 发怒时努力控制,不让任何人知道","B. 觉察自己的情绪状态并了解产生的原因","C. 了解别人的情绪状态","D. 不断激励自己,增强容忍力"],"ans":"A"},
{"q":"下列哪一项不属于表达感受的有效方式？?","opts":["A. 表达感受增进沟通","B. 对自己诚实,不隐瞒及否定感受","C. 找寻及说出感受的来源","D. 在任何环境下都去表达感受"],"ans":"D"},
{"q":"下列哪一项不属于情绪调节的常用方式？?","opts":["A. 宣泄法","B. 否认法","C. 暗示法","D. 运动法"],"ans":"B"},
{"q":"下列哪一项不属于Ellis\"ABCD\"理论？?","opts":["A. 诱发事件","B. 自我信念","C. 积极结果","D. 观念调整"],"ans":"C"},
{"q":"下列哪一项不属于不合理信念的特征？?","opts":["A. 绝对化要求","B. 客观真实","C. 过分概括化","D. 糟糕至极"],"ans":"B"},
{"q":"下列哪一项不属于Seligman乐观解释风格？?","opts":["A. 暂时性的","B. 个别的","C. 他人的","D. 非个人的"],"ans":"C"},
{"q":"以下描述属于吉尔福特(J.Guilford)提出的创造力人格的是？?","opts":["A. 拥有充沛的体能,但都是很安静的休息者,贪玩同时又遵守纪律","B. 容忍事物的模糊性,期望被认可","C. 愿意克服障碍,追求完美的结果","D. 有高度的独立性、旺盛的求知欲以及幽默感,能够长时间专注于某个感兴趣问题中"],"ans":"D"},
{"q":"创造性思维评估的指标是？?","opts":["A. 流畅性、独创性和灵活性","B. 高效性、敏捷性和丰富性","C. 乐观性、幽默性和多产性","D. 独特性、唯一性和实用性"],"ans":"A"},
{"q":"以下说法,哪一项是正确的？?","opts":["A. 创造性培养最根本的问题是塑造创造性人格","B. 创造力和智力属于同一个范畴","C. 创造性培养最根本的问题是，是否处于一个良好的环境中","D. 每个人的潜能只能挖掘出4%-10%,大学时期潜能开发较为困难"],"ans":"A"},
{"q":"下列选项都有助于你提高创造智商CQ的是？?","opts":["A. 多观察多思考、敢于提出质疑、追求完美","B. 保持好奇心、坚韧刻苦、全力以赴","C. 积极思维、善用想象、对事物保持批判","D. 热爱生活、保持乐观的心态、主动训练自己"],"ans":"D"},
{"q":"根据罗晓路，俞国良2010年研究，下列关于大学生心理健康与创造力的关系哪一项是正确的？?","opts":["A. 心理健康水平与创造力呈负相关","B. 心理健康水平与创造力不存在显著关系","C. 心理健康水平的提升，不能促进创造力的发挥和发展","D. 心理健康水平的提升，可以促进创造力的发挥和发展"],"ans":"D"},
{"q":"下列哪一项不属于创造智商CQ的主要构成？?","opts":["A. 变通能力","B. 觉察能力","C. 冒险能力","D. 学习能力"],"ans":"D"},
{"q":"下列哪一项不属于创造智商CQ高者的特征？?","opts":["A. 对传统事务和权威有独到意见","B. 对是非曲直有辨别能力","C. 喜欢批判评价他人","D. 拥有丰富的直觉"],"ans":"C"},
{"q":"下列关于聚合思维和发散思维，描述错误的是？?","opts":["A. 聚合思维以逻辑为基础","B. 聚合思维具有不稳定性、无方向性的特点","C. 发散思维以形象思维为基础","D. 发散思维也是直觉思维，与知识经验的丰富程度有密切关系"],"ans":"B"},
{"q":"下列不属于Taylor提出的创造力分类是？?","opts":["A. 表达式的创造","B. 技术性的创造","C. 发明式的创造","D. 艺术性的创造"],"ans":"D"},
{"q":"影响创造力的因素描述错误的是？?","opts":["A. 创造力的强弱与主观和客观因素都有关，两者互为影响","B. 主观因素包括：性格、个人的思维方法和个人所在的环境","C. 客观因素包括：家庭、不同团体、教育制度、文化及社会因素","D. 个体面对需要时候，能够奋起应对，激发自己不知晓的能力"],"ans":"B"},
{"q":"下列哪一项不属于心理资本的是？?","opts":["A. 自信","B. 希望","C. 乐观","D. 意志"],"ans":"D"},
{"q":"悲观者对逆境反应模式是？?","opts":["A. 永久因素,影响有限,外在因素","B. 永久因素,影响一切,内在因素","C. 暂时因素,影响有限,外在因素","D. 暂时因素,影响一切,内在因素"],"ans":"B"},
{"q":"宾西法尼亚大学心理学系教授凯伦·瑞维奇(Karen Reivich)和安德鲁·夏特(Andrew Shatte)认为,抗逆力涵盖两个层面?","opts":["A. 从困境复原的能力和寻求积极意义","B. 对自我情绪的意识和控制冲动","C. 从困境复原的能力和乐观","D. 控制冲动和寻求积极意义"],"ans":"A"},
{"q":"下列哪一项不属于Garmezy(1988)的抗逆力保护因子的是？?","opts":["A. 积极人格特质的建构","B. 家庭支持系统的建立","C. 社会支持与外在资源的建构","D. 亲密关系的维护"],"ans":"D"},
{"q":"以下不属于抗逆力的个人保护因子的是？?","opts":["A. 对事件的乐观归因能力","B. 幽默感","C. 满足感","D. 自我效能感"],"ans":"C"},
{"q":"以下不属于个体抗逆力的家庭保护因子的是？?","opts":["A. 支持与关心孩子的父母与良好的亲子联结","B. 较少的家庭冲突","C. 乐观的父母生活态度","D. 父母的道德观念"],"ans":"D"},
{"q":"以下不属于个体抗逆力的环境保护因子的是？?","opts":["A. 有关心孩子的亲朋好友","B. 孩子在社区与学校都有重要他人的人际支持系统","C. 成功的学校经验","D. 社区丰富的娱乐设施"],"ans":"D"},
{"q":"以下哪一项不属于学校为个体抗逆力提供的保护因子？?","opts":["A. 鼓励学生尽量参与学校各项活动","B. 对学生的学业成就应要求高但需合理","C. 教师对学生应表现出关心、支持的态度","D. 学校严格各项考试的设置"],"ans":"D"},
{"q":"外在保护因子中最重要的保护因子是？?","opts":["A. 关怀","B. 支持","C. 情感连结","D. 分担"],"ans":"C"},

        // 全局状态
        let appState = {
            mode: 'all',
            currIdx: 0,
            currPaper: [],
            errorList: [],
            settings: {
                showAns: false,
                allPage: false,
                autoNext: false
            }
        };

        // DOM元素
        const questionBox = document.getElementById('questionBox');
        const currIdxEl = document.getElementById('currIdx');
        const totalNumEl = document.getElementById('totalNum');
        const errorCountEl = document.getElementById('errorCount');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const showAnsSwitch = document.getElementById('showAnsSwitch');
        const allPageSwitch = document.getElementById('allPageSwitch');
        const autoNextSwitch = document.getElementById('autoNextSwitch');
        const resetCurrBtn = document.getElementById('resetCurr');
        const resetNewBtn = document.getElementById('resetNew');
        const clearErrorBtn = document.getElementById('clearError');
        const modeBtns = document.querySelectorAll('.mode-btn');
        // 弹窗元素
        const openSetBtn = document.getElementById('openSetBtn');
        const closeSetBtn = document.getElementById('closeSetBtn');
        const popupMask = document.getElementById('popupMask');
        const popupSet = document.getElementById('popupSet');
        const popSwitches = document.querySelectorAll('.pop-switch');
        const popBtns = document.querySelectorAll('.pop-btn');

        // 数组随机打乱
        function shuffleArr(arr) {
            let res = [...arr];
            for(let i = res.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [res[i], res[j]] = [res[j], res[i]];
            }
            return res;
        }

        // 本地存储
        function saveLocal() {
            localStorage.setItem('examAppState', JSON.stringify(appState));
        }
        function loadLocal() {
            let data = localStorage.getItem('examAppState');
            if(data) appState = JSON.parse(data);
            // 同步双端开关状态
            showAnsSwitch.checked = appState.settings.showAns;
            allPageSwitch.checked = appState.settings.allPage;
            autoNextSwitch.checked = appState.settings.autoNext;
            popSwitches.forEach(item => {
                item.checked = appState.settings[item.dataset.id.replace('Switch','')];
            });
            refreshErrorCount();
        }

        // 刷新错题数
        function refreshErrorCount() {
            errorCountEl.innerText = appState.errorList.length;
        }

        // 初始化试卷
        function initPaper(mode, isNew = true) {
            appState.mode = mode;
            if(isNew) appState.currIdx = 0;

            if(mode === 'all') {
                appState.currPaper = shuffleArr(questionBank);
            } else if(mode === 'rand50') {
                let temp = shuffleArr(questionBank);
                appState.currPaper = temp.slice(0, 50);
            } else if(mode === 'error') {
                if(appState.errorList.length === 0) {
                    questionBox.innerHTML = '<div class="empty-tip">暂无错题，快去刷题吧！</div>';
                    totalNumEl.innerText = 0;
                    currIdxEl.innerText = 0;
                    saveLocal();
                    return;
                }
                appState.currPaper = shuffleArr(appState.errorList);
            }

            totalNumEl.innerText = appState.currPaper.length;
            renderQuestions();
            saveLocal();
            modeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
        }

        // 渲染题目
        function renderQuestions() {
            questionBox.innerHTML = '';
            const {currPaper, currIdx, settings} = appState;
            if(currPaper.length === 0) return;

            let renderList = settings.allPage ? currPaper : [currPaper[currIdx]];

            renderList.forEach((item, idx) => {
                let qDiv = document.createElement('div');
                qDiv.className = 'q-item';
                let shuffledOpts = shuffleArr([...item.opts]);
                let correctOpt = item.ans;

                let html = `<div class="q-title">${settings.allPage ? idx+1 : currIdx+1}. ${item.q}</div>`;
                shuffledOpts.forEach(opt => {
                    html += `<div class="option-item" data-ans="${correctOpt}" data-val="${opt.charAt(0)}">${opt}</div>`;
                });
                html += `<div class="answer-hint">正确答案：${correctOpt}</div>`;
                qDiv.innerHTML = html;
                questionBox.appendChild(qDiv);
            });

            bindOptionClick();
            updatePageBtn();
            currIdxEl.innerText = currIdx + 1;
        }

        // 绑定选项点击
        function bindOptionClick() {
            const optionItems = document.querySelectorAll('.option-item');
            optionItems.forEach(opt => {
                opt.onclick = function() {
                    if(this.classList.contains('correct') || this.classList.contains('wrong')) return;

                    let userAns = this.dataset.val;
                    let rightAns = this.dataset.ans;
                    let parentQ = this.closest('.q-item');
                    let hint = parentQ.querySelector('.answer-hint');

                    if(userAns === rightAns) {
                        this.classList.add('correct');
                        let qItem = appState.currPaper[appState.currIdx];
                        appState.errorList = appState.errorList.filter(x => x.q !== qItem.q);
                        refreshErrorCount();
                        if(appState.settings.autoNext) {
                            setTimeout(() => nextQuestion(), 600);
                        }
                    } else {
                        this.classList.add('wrong');
                        let qItem = appState.currPaper[appState.currIdx];
                        let hasExist = appState.errorList.some(x => x.q === qItem.q);
                        if(!hasExist) {
                            appState.errorList.push(qItem);
                            refreshErrorCount();
                        }
                        parentQ.querySelectorAll('.option-item').forEach(o => {
                            if(o.dataset.val === rightAns) o.classList.add('correct');
                        });
                    }

                    if(appState.settings.showAns) {
                        hint.style.display = 'block';
                    }
                    saveLocal();
                }
            });
        }

        // 上下题
        function prevQuestion() {
            if(appState.currIdx > 0) {
                appState.currIdx--;
                renderQuestions();
                saveLocal();
            }
        }
        function nextQuestion() {
            if(appState.currIdx < appState.currPaper.length - 1) {
                appState.currIdx++;
                renderQuestions();
                saveLocal();
            }
        }

        // 分页按钮状态
        function updatePageBtn() {
            prevBtn.disabled = appState.currIdx === 0;
            nextBtn.disabled = appState.currIdx === appState.currPaper.length - 1;
        }

        // 开关同步逻辑
        function syncSwitch(name, val) {
            appState.settings[name] = val;
            // 同步电脑端+弹窗开关
            document.getElementById(name+'Switch').checked = val;
            popSwitches.forEach(item=>{
                if(item.dataset.id === name+'Switch') item.checked = val;
            });
            saveLocal();
            renderQuestions();
        }

        // 电脑端开关监听
        showAnsSwitch.onchange = ()=>syncSwitch('showAns', showAnsSwitch.checked);
        allPageSwitch.onchange = ()=>syncSwitch('allPage', allPageSwitch.checked);
        autoNextSwitch.onchange = ()=>syncSwitch('autoNext', autoNextSwitch.checked);

        // 弹窗开关监听
        popSwitches.forEach(item=>{
            item.onchange = function(){
                let key = this.dataset.id.replace('Switch','');
                syncSwitch(key, this.checked);
            }
        });

        // 弹窗打开关闭
        function openPopup() {
            popupMask.classList.add('show');
            popupSet.classList.add('show');
        }
        function closePopup() {
            popupMask.classList.remove('show');
            popupSet.classList.remove('show');
        }
        openSetBtn.onclick = openPopup;
        closeSetBtn.onclick = closePopup;
        popupMask.onclick = closePopup;

        // 弹窗功能按钮
        popBtns.forEach(btn=>{
            btn.onclick = function(){
                const type = this.dataset.type;
                if(type === 'resetCurr') resetCurrBtn.click();
                if(type === 'resetNew') resetNewBtn.click();
                if(type === 'clearError') clearErrorBtn.click();
                setTimeout(closePopup,300);
            }
        });

        // 页面按钮事件
        prevBtn.onclick = prevQuestion;
        nextBtn.onclick = nextQuestion;

        resetCurrBtn.onclick = function() {
            renderQuestions();
        };
        resetNewBtn.onclick = function() {
            initPaper(appState.mode, true);
        };
        clearErrorBtn.onclick = function() {
            if(confirm('确定清空所有错题记录？不可恢复！')) {
                appState.errorList = [];
                refreshErrorCount();
                saveLocal();
                if(appState.mode === 'error') {
                    initPaper('error');
                }
            }
        };

        modeBtns.forEach(btn => {
            btn.onclick = function() {
                initPaper(this.dataset.mode, true);
            };
        });

        // 初始化
        window.onload = function() {
            loadLocal();
            initPaper(appState.mode, false);
        };
    </script>
</body>
</html>
